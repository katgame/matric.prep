services:
  db:
    image: postgres:16
    container_name: matricprep-db
    environment:
      POSTGRES_DB: matricprep
      POSTGRES_USER: matric
      POSTGRES_PASSWORD: matric
    ports:
      - "5432:5432"
    volumes:
      - matricprep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matric -d matricprep"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server/MatricPrep.Api
      dockerfile: Dockerfile
    container_name: matricprep-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MatricPrep: Host=db;Port=5432;Database=matricprep;Username=matric;Password=matric
      # Tutor chat via OpenAI (do not hardcode secrets here; set OPENAI_API_KEY in your shell or .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MatricPrep__TutorChat__Enabled: "true"
      MatricPrep__TutorChat__Provider: openai
      MatricPrep__TutorChat__Model: gpt-4o-mini
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  matricprep_pgdata:

